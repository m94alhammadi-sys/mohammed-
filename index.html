<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sky Avero | المنتجات والأسعار</title>
  <meta name="description" content="متجر Sky Avero - المنتجات والأسعار والطلب مباشرة">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a href="#" class="logo" id="logo"></a>
      <button class="cart-btn" id="cartBtn" aria-label="السلة">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
        <span class="count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <section class="hero">
    <div class="wrap">
      <h1 id="storeName"></h1>
      <p id="tagline"></p>
      <div class="hero-actions">
        <a href="#products" class="btn primary">تصفح المنتجات</a>
        <a id="igLink" class="btn ghost" target="_blank" rel="noopener">تابعنا على انستقرام</a>
      </div>
    </div>
  </section>

  <main class="wrap" id="products">
    <div class="toolbar">
      <input type="search" id="search" placeholder="ابحث عن منتج…">
      <div class="filters" id="filters"></div>
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>لا توجد منتجات مطابقة.</p>
  </main>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-panel">
      <div class="drawer-head">
        <h2>سلة الطلب</h2>
        <button class="close" id="closeCart" aria-label="إغلاق">×</button>
      </div>
      <div id="cartItems" class="cart-items"></div>
      <div class="drawer-foot">
        <div class="total"><span>الإجمالي</span><strong id="cartTotal">0</strong></div>
        <button class="btn primary full" id="orderWa">اطلب عبر واتساب</button>
        <button class="btn ghost full" id="orderIg">اطلب عبر انستقرام</button>
        <p class="hint" id="igHint" hidden>تم نسخ تفاصيل الطلب ✔ الصقها في رسالة الانستقرام.</p>
      </div>
    </div>
  </aside>

  <footer class="footer">
    <div class="wrap">
      <p>© <span id="year"></span> <span id="footName"></span> — جميع الحقوق محفوظة</p>
    </div>
  </footer>

  <script src="products.js"></script>
  <script src="app.js"></script>
</body>
</html>
