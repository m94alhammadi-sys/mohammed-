name: Build APK

# يُبنى الـ APK هنا لأن بيئة التطوير المحلية قد تكون محجوبة عن
# dl.google.com (مصدر Android SDK و AGP)، بينما منصّة GitHub تملك
# الحزمة كاملة وشبكة مفتوحة.
on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: سحب المستودع
        uses: actions/checkout@v4

      - name: تهيئة JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: تهيئة Android SDK
        uses: android-actions/setup-android@v3

      - name: تهيئة Gradle مع التخزين المؤقت
        uses: gradle/actions/setup-gradle@v4

      - name: بناء نسخة التصحيح
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: بناء نسخة الإصدار
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: إعادة تسمية المخرجات
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/majlis-decision-debug.apk"
          cp android/app/build/outputs/apk/release/app-release.apk \
             "artifacts/majlis-decision-release.apk"
          ls -la artifacts

      - name: رفع الـ APK كمُخرَج قابل للتنزيل
        uses: actions/upload-artifact@v4
        with:
          name: majlis-decision-apk
          path: artifacts/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: نشر إصدار دائم بالـ APK
        if: github.ref_name == 'claude/intelligent-goldberg-cbajwt'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: مجلس القرار — APK بناء ${{ github.run_number }}
          body: |
            تطبيق «مجلس القرار» لأندرويد، بتصميم داكن بلمسة صفراء.

            - `majlis-decision-debug.apk` — للتثبيت المباشر والتجربة.
            - `majlis-decision-release.apk` — نسخة الإصدار (موقّعة بمفتاح التصحيح).

            الحد الأدنى: أندرويد 7.0 (API 24).
            التطبيق يعمل ببيانات عرض توضيحية موسومة، ويتصل بخادم
            «مجلس القرار» تلقائياً إن كان متاحاً.
          files: artifacts/*.apk
          fail_on_unmatched_files: true
